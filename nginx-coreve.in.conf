server {
    server_name coreve.in;

    root /var/www/coreve.in;
    index index.php index.html;

    access_log /var/log/nginx/coreve.in_access.log;
    error_log  /var/log/nginx/coreve.in_error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # FastCGI cache skip conditions
    set $skip_cache 0;
    if ($request_method = POST) { set $skip_cache 1; }
    if ($query_string != "") { set $skip_cache 1; }
    if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*.php|/feed/|sitemap(_index)?.xml") { set $skip_cache 1; }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_") { set $skip_cache 1; }
    if ($request_uri ~* "^/(cart|checkout|my-account|wp-json)(/|$|\?)") { set $skip_cache 1; }

    # Fresh dynamic storefront; cart sessions must never receive a static preview.
    if ($request_uri ~* "^/($|\?|shop(/|$)|product(/|$))") { set $skip_cache 1; }

    # Isolated static design preview: no WordPress execution or shopping APIs.
    # Project memory & internal handover docs: private to filesystem/git, deny public web requests
    location ^~ /project-memory/ {
        deny all;
        return 404;
    }

    location ^~ /staging/ {
        index index.html;
        autoindex off;
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    }


    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
    location = /sitemap.xml { return 301 /wp-sitemap.xml; }
    location = /llms.txt    { log_not_found off; access_log off; }
    location = /llms-full.txt { log_not_found off; access_log off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-coreve.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;

        # Respect application privacy and Set-Cookie headers.
        fastcgi_ignore_headers Expires;
        fastcgi_cache coreve_cache;
        fastcgi_cache_valid 200 301 302 60m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
                add_header X-FastCGI-Cache $upstream_cache_status;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.(git|svn) {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/coreve.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/coreve.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    listen 80;
    listen [::]:80;
    server_name coreve.in www.coreve.in;
    return 301 https://coreve.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.coreve.in;
    ssl_certificate /etc/letsencrypt/live/coreve.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coreve.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://coreve.in$request_uri;




}