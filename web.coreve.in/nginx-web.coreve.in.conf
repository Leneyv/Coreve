# Nginx Virtual Host for web.coreve.in
# IT Services & Autonomous AI Solutions by Coreve Tech
# Strict Anti-Indexing (SEO, AEO, and GEO Blocked)

server {
    server_name web.coreve.in;

    root /var/www/web.coreve.in;
    index index.html;

    # Anti-indexing headers for SEO, AEO, and GEO (Search Engines & AI Bots)
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security: Deny all public access to project memory and internal documentation
    location ^~ /project-memory {
        deny all;
        return 403;
    }

    # Security: Deny access to hidden files and git
    location ~ /\. {
        deny all;
        return 403;
    }

    # Main routing
    location / {
        try_files $uri $uri/ =404;
    }

    # Static asset caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
        access_log off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/web.coreve.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/web.coreve.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = web.coreve.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name web.coreve.in;
    return 404; # managed by Certbot
}
