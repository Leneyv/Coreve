# Nginx Virtual Host for web.coreve.in
# IT Services & Autonomous AI Solutions by Coreve Tech

server {
    listen 80;
    listen [::]:80;
    server_name web.coreve.in;

    root /var/www/web.coreve.in;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security: Deny all public access to project memory and internal documentation
    location ^~ /project-memory {
        deny all;
        return 403;
    }

    # Security: Deny access to hidden files and git
    location ~ /\. {
        deny all;
        return 403;
    }

    # Main routing
    location / {
        try_files $uri $uri/ =404;
    }

    # Static asset caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
